confirm_os_window_close 0

update_check_interval 0


#### Font ####

# nerd-fonts.jetbrains-mono is installed in modules/fonts.nix; name it explicitly
# or kitty falls back to the default monospace and loses the Nerd Font glyphs
# the shell prompt and waybar rely on.
font_family       JetBrainsMono Nerd Font
font_size         11.0
disable_ligatures cursor


#### Theme: ThinkPad red ####

# Background is a dark, desaturated take on the ThinkPad/TrackPoint red (#c8102e)
# so text stays readable; the full-strength red is kept for the cursor, borders
# and the accent (color1/color9) slots.
foreground            #e6dadb
background            #000000
selection_foreground  #1f070b
selection_background  #c8102e

cursor                #c8102e
cursor_text_color     #ffffff

# Hyprland does the actual blurring (decoration.blur in hypr/appearance.lua);
# kitty only has to hand it a translucent surface. background_blur is set as
# well for compositors that blur via the protocol themselves -- it is a no-op
# under Hyprland rather than a conflict.
background_opacity         0.88
background_blur            1
dynamic_background_opacity yes

url_color #6b72ff

# ANSI palette -- standard 16 colours, reds pushed toward the ThinkPad tone.
# black
color0  #180608
color8  #392225
# red
color1  #c8102e
color9  #f2415b
# green
color2  #8fae6b
color10 #a9c886
# yellow
color3  #d99a4e
color11 #f0b968
# blue
color4  #6a8cc4
color12 #88a8dd
# magenta
color5  #a86f9e
color13 #c78dbb
# cyan
color6  #6fa8a0
color14 #8ac4bc
# white
color7  #e6dadb
color15 #fdf6f6


#### Window chrome ####

# Hyprland already draws a border and rounds the corners; a second set of
# decorations from kitty would sit inside them.
hide_window_decorations yes

cursor_trail                 1
cursor_trail_decay           0.1 0.4
cursor_trail_start_threshold 2

url_style curly

# A red flash instead of a beep.
enable_audio_bell    no
visual_bell_duration 0.1
visual_bell_color    #c8102e
window_alert_on_bell yes

# Search / hint highlights stay on-palette.
mark1_foreground #ffffff
mark1_background #c8102e
mark2_foreground #2b0d12
mark2_background #f0b968
