#############################
####   HYPRIDLE CONFIG   ####
#############################
#
# Idle daemon: dims, then locks, then sleeps. Started from autostart.lua.
#
# https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid stacking lockers
    before_sleep_cmd = loginctl lock-session    # lock before suspending
    after_sleep_cmd = hyprctl dispatch dpms on  # wake the screen on resume
}

# 5 min: dim the backlight as a warning, restore it on any input.
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# 10 min: lock.
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 11 min: screen off. After the lock, so the display never goes dark on an
# unlocked session.
listener {
    timeout = 660
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 30 min: suspend.
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
