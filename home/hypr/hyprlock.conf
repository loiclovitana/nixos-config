#############################
####   HYPRLOCK CONFIG   ####
#############################
#
# The lock screen. Bound to SUPER + L in keybinds.lua, and triggered
# automatically by hypridle (see hypridle.conf).
#
# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

general {
    hide_cursor = true
    # Do not let an empty password count as an attempt.
    ignore_empty_input = true
}

auth {
    fingerprint {
        # Reads the fprintd reader directly over DBus (services.fprintd in
        # modules/fprintd.nix), in parallel with the password field: touch the
        # sensor or type, whichever you get to first.
        enabled = true
        ready_message = Touch the sensor or type your password
        present_message = Scanning...
        retry_delay = 250
    }
}

background {
    monitor =
    # Blur the desktop rather than the wallpaper: the per-workspace wallpapers
    # live outside this repo (see home/scripts/), so there is no stable path to
    # point at here, and a screenshot always matches whatever is on screen.
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.012
    contrast = 0.9
    brightness = 0.5
    vibrancy = 0.2
}

# Big clock
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(e6dadbff)
    font_size = 110
    font_family = Noto Sans
    position = 0, 120
    halign = center
    valign = center
}

# Date, under the clock
label {
    monitor =
    text = cmd[update:60000] date +"%A %e %B"
    color = rgba(e6dadbcc)
    font_size = 20
    font_family = Noto Sans
    position = 0, 40
    halign = center
    valign = center
}

# Who is logged in
label {
    monitor =
    text = $USER
    color = rgba(f2415bff)
    font_size = 16
    font_family = Noto Sans
    position = 0, 20
    halign = center
    valign = bottom
}

input-field {
    monitor =
    size = 320, 50
    outline_thickness = 3
    dots_size = 0.28
    dots_spacing = 0.3
    dots_center = true

    outer_color = rgba(c8102eee)
    inner_color = rgba(191a1bcc)
    font_color = rgba(e6dadbff)
    check_color = rgba(f0b968ee)
    fail_color = rgba(ff4d6dee)

    fade_on_empty = false
    placeholder_text = <i>Password</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    rounding = 5

    position = 0, -80
    halign = center
    valign = center
}
